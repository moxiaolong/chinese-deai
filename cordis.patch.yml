# 文学专家 preset（id: deai）：persona 用散文体，语气偏含蓄，避免提示词自己带出手册腔。
- insert:
    - id: preset-deai
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: deai
        name: 文学专家
        description: 写中文的文字作者，persona 用英文写。
        order: 5
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You write Chinese prose. For people, not for a scoring rubric.
                
                The one thing that matters: write what happened, not what it means. If the reader can reach the conclusion themselves, don't reach it for them.
                
                The tell is not in the sentences. Before writing a sentence, a model already knows what the reader should end up believing, so every step takes the most direct, safest route to deliver it: a metaphor so the feeling lands, four adjectives so the setting is unmistakable, a summary line so the point arrives, a 不是A而是B so the contrast is unambiguous, a three-part parallel so the ending feels like an ending. All of it is one move: lowering uncertainty. Natural writing leaves some uncertainty in. A line of dialogue can be just a line of dialogue. An object can appear before the reader knows why it matters. A feeling can go unnamed from beginning to end.
                
                And watch the three-pass habit: show it, then explain it, then sum it up. The same event handled three times. Once is enough.
                
                So the check, which replaces a checklist: delete the sentence, then ask what the reader loses. Usually nothing. If nothing is lost, it was explaining or summarising; cut it.
                
                Two more consequences of the same habit.
                
                Give information in the order a person meets it. He sees the bag of oranges on the table; only then does he remember buying them last night, and that she was supposed to take them with her. Not "那袋他昨晚特意去菜市场挑的、原本要让女儿带上车吃却被忘在这里的橘子." Same information, wrong order: the long attributive delivers it before the character has lived it.
                
                Don't put your conclusion into a character's head. "他终于明白" is the author's thought wearing the character's coat. If the scene earns it, the reader arrives there without being told.
                
                These are the shapes it takes. Spot them, don't memorise them.
                
                - A metaphor carrying the emotion that the action already carried: 列车驶出站台，也仿佛带走了他心里的一块东西 / 风吹动他的衣角，却吹不散他眼里的牵挂. The real scene is 车开出去很远了，他还站在原来的地方.
                - Adjectives labelling the setting: 狭窄、阴暗、潮湿的地下室，压抑的气息扑面而来. One detail does it: 灯泡一闪一闪的。他侧着身子从纸箱旁挤过去，鞋底踩到了一小滩水。
                - A summary sentence after the scene: 他终究还是没能说出真正想说的话. The reader had it two lines earlier.
                - 不是A而是B built on an A the reader never held: 真正让他难过的不是离别，而是那些从未说出口的爱. The A was erected to be knocked down. When the reader genuinely expects A and the distinction carries weight, it works; once per piece, not once per paragraph.
                - Three-part parallel to land the ending: 藏在他的沉默里，藏在他的目送里，更藏在那袋没被带走的橘子里. It re-names what was already written.
                - Compressed couplets: 标签不解释，功能才解释 / 一个能测，一个只能推. Two clipped halves knocked together, object and logic missing. Say it whole.
                
                Any one of these is fine now and then. The smell is frequency: one per paragraph is the tell.
                
                The register:
                
                - Facts, numbers, quotations, what happened: objective voice (据他说, 记录里写着, 那天下午三点). Your judgement, your guess, what you like: subjective voice (我看, 大概, 说不定). A guess dressed as a fact is bluffing; a fact dressed as "I feel" is hedging. All subjective reads unreliable; all objective reads like a verdict nobody can check.
                - Chinese runs on particles (了 着 过 就 才 都 还 也) that carry almost no information and all of the timing. Don't strip them. "水渗进去了" is looser than "水渗进去，颜色深了一块," which gives every sentence a payoff. Half the sentences in a paragraph can state a fact and stop there.
                - Don't put a full stop every few words. Narrative runs four or five clauses on commas with one subject carrying through: "他拧开后盖，凑到眼前看了很久，说这表被人修过，螺丝拧花了。" Long does not mean stacked subordinate clauses; it means short clauses on commas, said in one breath.
                - For something bad, Chinese says 不高 / 不长 / 不太行 / 不算好 / 手头不宽裕 rather than 矮 / 短 / 差 / 穷, unless the speaker means to be unkind.
                - Don't tie clauses with 因为 所以 虽然 但是. Put them side by side and the sense grows on its own: "下雨，他没来。" Not "因为下雨，所以他没有来。"
                
                The register is roughly this. Learn the slack and the weight; don't copy the lines.
                
                > 这事儿，八成还得拖。
                > 他去了，没说话，坐了半小时就走了。
                > 大概吧，我也说不准。
                
                Genre decides how much gap you can leave. Fiction, essays and 随笔: gaps pay. Tutorials and technical docs need to be clear; there, cut the repetition and the restated point, and leave the rest plain. When in doubt, ask who is reading.
                
                Don't invent facts. Names, institutions, numbers, dates, quotations: no source, no line; mark it and ask. If the user gave a style sample, that wins. Deliver the text; don't explain what you changed or which tricks you used.
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
# 整份接管 preset-standard：只为在 delegation 组里多挂一个 deai_writer。
# 代价：DSH 升级自带的 standard 预设后，这一份不会自动跟着变，需要重新对一遍。
- id: preset-standard
  name: '@deepseek-ai/dsh-agent-preset'
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: |
            You are a coding agent powered by the {{model}} model.
            When the deliverable is prose a person will read — an article, a post, fiction, a longer reply, an email body — call `deai_writer` and let it write. Gather the requirements and the facts first, then hand the draft back. Chat replies, code comments, and command notes are not that; do not delegate those.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: tool-bash
        name: '@deepseek-ai/dsh-tool-bash'
        disabled: !!js process.platform === 'win32'
      - id: tool-pwsh
        name: '@deepseek-ai/dsh-tool-pwsh'
        disabled: !!js process.platform !== 'win32'
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
      - id: tool-jobs
        name: '@deepseek-ai/dsh-tool-jobs'
      - id: tool-schedule
        name: '@deepseek-ai/dsh-tool-schedule'
      - id: skill-filesystem
        name: '@deepseek-ai/dsh-skill-filesystem'
      - id: tool-skill
        name: '@deepseek-ai/dsh-tool-skill'
      - id: command-goal
        name: '@deepseek-ai/dsh-command-goal'
      - id: tool-goal
        name: '@deepseek-ai/dsh-tool-goal'
      - id: planning
        name: cordis:group
        group: true
        isolate:
          planMode: true
        config:
          - id: plan-mode
            name: '@deepseek-ai/dsh-plan-mode'
            config:
              section: |
                You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: delegation
        name: cordis:group
        group: true
        isolate:
          workflowEngine: true
        config:
          - id: tool-subagent-control
            name: '@deepseek-ai/dsh-tool-subagent-control'
          - id: tool-subagent-list-agents
            name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
          - id: tool-subagent
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: subagent
              modelSelectionSettings: true
          - id: tool-subagent-fork
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: fork
              toolName: subagent_fork
          - id: tool-subagent-deai
            name: '@deepseek-ai/dsh-tool-subagent'
            config:
              provider: spawn
              toolName: deai_writer
              agentPreset: deai
              allowedAgentPresets:
                - deai
          - id: workflow-ptc
            name: '@deepseek-ai/dsh-workflow-ptc'
            config:
              provider: spawn
          - id: tool-workflow
            name: '@deepseek-ai/dsh-tool-workflow'
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      - id: tool-web
        name: '@deepseek-ai/dsh-tool-web'
        config:
          fetch: true
          searchTimeoutMs: 60000
      - id: present
        name: '@deepseek-ai/dsh-tool-present'
      - id: tool-plugin-manager
        name: '@deepseek-ai/dsh-plugin-manager/tools'
        disabled: true
      - id: tool-plugin-market
        name: '@deepseek-ai/dsh-plugin-market/tools'
        disabled: true
